<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>音楽クイズ</title>
  <style>
    body {
      text-align: center;
      font-family: sans-serif;
      background-color: #000;
      color: #fff;
    }

    #startBtn {
      font-size: 20px;
      padding: 10px 30px;
      margin-top: 30px;
    }

    .choice {
      display: block;
      margin: 10px auto;
      padding: 10px;
      width: 80%;
      font-size: 16px;
    }

    .selected {
      border: 2px solid blue;
    }
  </style>
</head>
<body>

  <!-- ★ スタートボタン（これが無いと絶対に動かない） -->
  <button id="startBtn" disabled>スタート</button>

  <!-- 画面表示用 -->
  <div id="screen"></div>

  <!-- YouTubeプレイヤー -->
  <div id="player"></div>

  <!-- YouTube API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <!-- メインJS -->
  <script src="{{ url_for('static', filename='main.js') }}"></script>

</body>
</html>
